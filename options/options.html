<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Video Fast — Configurações</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="vf-wrap">
      <h1>⚡ Video Fast — Configurações</h1>

      <section class="vf-card">
        <h2>Velocidade e volume de vídeo</h2>

        <div class="vf-row">
          <label class="vf-checkbox">
            <input type="checkbox" id="enabledToggle" />
            Ativar aceleração automática de vídeos
          </label>
        </div>

        <div class="vf-row">
          <label for="speedInput">Velocidade padrão aplicada a todos os vídeos</label>
          <div class="vf-inline">
            <input type="number" id="speedInput" min="0.1" max="16" step="0.05" />
            <span>x</span>
          </div>
        </div>

        <div class="vf-row">
          <label for="volumeInput">
            Ganho de volume
            <span class="vf-hint">
              100% = volume normal do vídeo. Acima de 100% amplifica o áudio além do máximo
              nativo do navegador (via Web Audio API).
            </span>
          </label>
          <div class="vf-inline">
            <input type="number" id="volumeInput" min="0" max="500" step="5" />
            <span>%</span>
          </div>
        </div>

        <div class="vf-row">
          <label for="ignoreListArea">
            Sites ignorados (um por linha)
            <span class="vf-hint">
              Aceita domínio ("exemplo.com"), curinga ("*.exemplo.com") ou trecho de URL
              ("exemplo.com/caminho"). Nesses sites nem a velocidade nem o ganho de volume são
              alterados.
            </span>
          </label>
          <textarea id="ignoreListArea" rows="8" placeholder="twitch.tv&#10;kick.com&#10;*.outroexemplo.com"></textarea>
        </div>

        <div class="vf-row vf-actions">
          <button type="button" id="saveVideoBtn" class="vf-btn-primary">Salvar</button>
          <span id="videoSavedHint" class="vf-saved-hint"></span>
        </div>
      </section>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
